name: Deploy MCP Gateway

# Manual, reviewer-gated deploy of the mcp-gateway edge function only.
#
# * Trigger: workflow_dispatch only. There is no push trigger, so merging to main
#   never deploys anything.
# * The job runs in the GitHub Environment `production-db` (owner as required reviewer,
#   deployment branches limited to `main`) and refuses to run from any other ref.
# * It never applies migrations and never touches any other function.
# * GitHub secrets (names only): SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF.
# * Runtime secrets live in the Supabase project, not in GitHub: MCP_GATEWAY_READ_KEY,
#   MCP_GATEWAY_WRITE_KEY (leave unset to keep every write tool refused),
#   MCP_GATEWAY_API_KEY (legacy, read scopes only), GITHUB_TOKEN, CLOUDFLARE_API_TOKEN,
#   CLOUDFLARE_ACCOUNT_ID, SUPABASE_SERVICE_ROLE_KEY.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why is a production mcp-gateway deploy being run?"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-mcp-gateway
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy mcp-gateway (reviewer-gated)
    if: github.ref == 'refs/heads/main'
    environment: production-db
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1
        with:
          version: latest

      - name: Deploy mcp-gateway
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DEPLOY_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required secret ${name} is not set (production-db environment or repository secrets)"
              exit 1
            fi
          done
          echo "Reason: ${DEPLOY_REASON}" >> "$GITHUB_STEP_SUMMARY"
          supabase functions deploy mcp-gateway --project-ref "$SUPABASE_PROJECT_REF"
