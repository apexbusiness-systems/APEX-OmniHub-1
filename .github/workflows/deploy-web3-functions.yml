name: Deploy Web3 Functions

# Manual, reviewer-gated deploy of one edge-function set per run: the Web3 and
# billing-portal functions, or apex-agent (chosen with the `target` input).
#
# * Trigger: workflow_dispatch only. There is no push trigger, so merging to main
#   never deploys anything.
# * The job runs in the GitHub Environment `production-db`, which must have the owner
#   as a required reviewer and deployment branches limited to `main`.
# * It never touches the database: no `supabase db push`, no migration repair, no
#   --include-all. Migrations are applied by the owner through their own gated path.
# * Secrets (names only): SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF for the deploy;
#   SUPABASE_ANON_KEY (fallback SUPABASE_SERVICE_ROLE_KEY) for the health check.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why is a production functions deploy being run?"
        required: true
        type: string
      target:
        description: "Which function set to deploy"
        required: true
        type: choice
        options:
          - web3-and-billing
          - apex-agent

permissions:
  contents: read

concurrency:
  group: deploy-web3-functions
  cancel-in-progress: false

jobs:
  deploy-functions:
    name: Deploy Supabase Edge Functions (reviewer-gated)
    if: github.ref == 'refs/heads/main'
    environment: production-db
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      # Supabase CLI analytics is nonessential in CI and can fail successful
      # commands during PostHog shutdown when the telemetry endpoint is slow.
      SUPABASE_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1
        with:
          version: latest

      - name: Require deploy secrets (fails closed)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF must be set (production-db environment or repository secrets)."
            exit 1
          fi

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DEPLOY_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          case "$DEPLOY_TARGET" in
            web3-and-billing)
              functions="web3-nonce web3-verify alchemy-webhook verify-nft platform-health omnilink-port create-billing-portal"
              ;;
            apex-agent)
              functions="apex-agent"
              ;;
            *)
              echo "::error::Unknown deploy target: ${DEPLOY_TARGET}"
              exit 1
              ;;
          esac
          for fn in $functions; do
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done

      - name: Deployment Summary
        if: always()
        env:
          DEPLOY_REASON: ${{ inputs.reason }}
          DEPLOY_TARGET: ${{ inputs.target }}
        run: |
          echo "## 🚀 Edge Functions Deployment" >> $GITHUB_STEP_SUMMARY
          echo "Target: ${DEPLOY_TARGET}" >> $GITHUB_STEP_SUMMARY
          echo "Reason: ${DEPLOY_REASON}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **Status:** Success" >> $GITHUB_STEP_SUMMARY
            echo "The listed functions were deployed. No database changes were made." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status:** Failed" >> $GITHUB_STEP_SUMMARY
            echo "Check logs for details on the deployment error." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Test Function Health
        if: success()
        shell: bash
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          # --- Configuration ---
          MAX_RETRIES=3
          RETRY_DELAY=5
          # ---------------------

          # 1. Validate Secrets
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::Missing required secret: SUPABASE_PROJECT_REF"
            exit 1
          fi

          # 2. Select Auth Token (Prefer Anon, Fallback to Service Role)
          AUTH_JWT="${SUPABASE_ANON_KEY:-}"
          if [ -z "${AUTH_JWT}" ] && [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "⚠️ SUPABASE_ANON_KEY missing. Falling back to SERVICE_ROLE_KEY."
            AUTH_JWT="${SUPABASE_SERVICE_ROLE_KEY}"
          fi

          if [ -z "${AUTH_JWT}" ]; then
            echo "::error::No JWT available. Set SUPABASE_ANON_KEY or SUPABASE_SERVICE_ROLE_KEY."
            exit 1
          fi

          # 3. Construct URL
          FUNCTIONS_URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"
          URL="${FUNCTIONS_URL}/platform-health"

          echo "Testing endpoint: ${URL}"

          # 4. Retry Logic Loop
          for ((i=1; i<=MAX_RETRIES; i++)); do
            echo "Attempt $i/$MAX_RETRIES..."

            HTTP_CODE=$(curl -sS -w "%{http_code}" -o /tmp/response.json \
              -H "apikey: ${AUTH_JWT}" \
              -H "Authorization: Bearer ${AUTH_JWT}" \
              -H "Content-Type: application/json" \
              "${URL}")

            if [ "${HTTP_CODE}" == "200" ]; then
              echo "✅ Healthcheck passed (HTTP 200)"
              cat /tmp/response.json || true # ci-integrity-allow: informational response body logging only
              exit 0
            else
              echo "⚠️ Attempt $i failed with HTTP ${HTTP_CODE}"
              cat /tmp/response.json || true # ci-integrity-allow: informational response body logging only
              echo ""

              if [ $i -lt $MAX_RETRIES ]; then
                sleep $RETRY_DELAY
              fi
            fi
          done

          # 5. Final Failure
          echo "::error::Healthcheck failed after ${MAX_RETRIES} attempts."
          exit 1
