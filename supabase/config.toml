project_id = "rtopreovkywofgwgmozi"

# Auth configuration
[auth]
enable_signup = true

# Enable Web3 authentication providers
[auth.external.ethereum]
enabled = true
client_id = "env(ETHEREUM_CLIENT_ID)"
secret = "env(ETHEREUM_CLIENT_SECRET)"
# Note: For demo/CI mode, set ETHEREUM_CLIENT_ID=demo and ETHEREUM_CLIENT_SECRET=demo

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[auth.external.apple]
enabled = true
client_id = "env(APPLE_CLIENT_ID)"
secret = "env(APPLE_CLIENT_SECRET)"
# Secret must be a JWT generated from Apple's .p8 private key
# Use: npm run apple:secret to generate it

[auth.external.solana]
enabled = false  # Enable when Solana support is needed

# Edge Functions Configuration
[functions.storage-upload-url]
verify_jwt = true

[functions.execute-automation]
verify_jwt = true

[functions.execute-workflow]
# Own internal auth (JWT for the "Trigger Run" button, shared secret for the
# pg_cron scheduler — see the function's own header comment) — same pattern
# as omnilink-port. Platform-level verify_jwt would reject the cron caller
# before that code runs, since it has no user JWT to present.
verify_jwt = false

[functions.create-billing-portal]
verify_jwt = true

[functions.byom-proxy]
verify_jwt = true

[functions.apex-assistant]
verify_jwt = true

[functions.apex-voice]
verify_jwt = false

[functions.notify-access-request]
# Own auth: X-Cron-Secret (vault cron_shared_secret) from the access_requests trigger.
verify_jwt = false

# Web3 Authentication Functions
[functions.web3-nonce]
verify_jwt = false  # Public endpoint to generate nonce for wallet signature

[functions.web3-verify]
verify_jwt = true  # Requires JWT for wallet signature verification

[functions.verify-nft]
verify_jwt = true  # Requires authenticated user to check NFT ownership

[functions.alchemy-webhook]
verify_jwt = false  # Webhook endpoint from Alchemy (uses signature verification)

# BYOM Cockpit — Phase 1 Credential Management
# Version: 1.0.0 | Date: 2026-02-17
[functions.byom-cockpit]
verify_jwt = true  # All BYOM credential operations require authenticated user

# Environment Variables for Edge Functions
# These blockchain-related secrets must be set in production environment:
# - WEB3_PRIVATE_KEY: OmniLink EVM private key for transaction signing
# - ALCHEMY_API_KEY_ETH: Alchemy API key for Ethereum RPC access
# - ALCHEMY_API_KEY_POLYGON: Alchemy API key for Polygon RPC access
# - MEMBERSHIP_NFT_ADDRESS: Deployed APEXMembershipNFT contract address
# - ALCHEMY_WEBHOOK_SIGNING_KEY: Secret for verifying Alchemy webhook signatures
#
# Set these in Supabase Dashboard → Project Settings → Edge Functions → Environment Variables
# DO NOT hardcode these values in code - they must be loaded from environment

# [functions.env] removed — ALLOWED_ORIGINS and PHYSIOMNI_LIVE_ENABLED are
# set via Supabase Dashboard → Project Settings → Edge Functions → Secrets.
# The [functions.env] block with arbitrary keys is not valid in CLI ≥2.x.

# OmniLink Port — Browser-facing module-state endpoint
# verify_jwt = false: Supabase gateway JWT check disabled to allow CORS preflight
# (OPTIONS requests have no Authorization header). Handler-level auth is preserved
# in the function code via supabase.auth.getUser() on all non-OPTIONS requests.
# See: supabase/functions/omnilink-port/index.ts handleModuleState()
[functions.omnilink-port]
verify_jwt = false

# Privileged MCP connector. The platform JWT gate is disabled because this
# endpoint uses a dedicated header secret and rejects missing configuration.
[functions.mcp-gateway]
verify_jwt = false

# APEX Agent — AI orchestration endpoint
# verify_jwt = true: Same-origin OmniPort Gateway forwards user JWT.
# Supabase gateway validation prevents unauthenticated invocations.
[functions.apex-agent]
verify_jwt = true

# OmniSkills Forge — generate-business-skills
# Deployed 2026-07-01 (PRCC-001 WP-1a): function existed in repo but was never
# deployed, causing silent 404s from SkillForge/OnboardingWizard/OmniSkillsForgePanel.
# verify_jwt = true: frontend invokes via supabase.functions.invoke with user JWT;
# handler additionally validates the user record and rate-limits per user.
[functions.generate-business-skills]
verify_jwt = true
